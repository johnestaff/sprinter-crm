<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprinter CRM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--bg2:#f5f5f4;--bg3:#eeece9;--tx:#1c1b19;--tx2:#6b6a67;--bd:#d9d7d2;--bd2:#e8e6e1;--r:6px;--rl:10px}
@media(prefers-color-scheme:dark){:root{--bg:#1c1b19;--bg2:#28271f;--bg3:#2e2d25;--tx:#f5f4f0;--tx2:#9a9890;--bd:#3d3b33;--bd2:#333228}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg3);color:var(--tx);font-size:14px}
#app{display:flex;height:100vh;overflow:hidden}
#loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:16px}
.spin{width:36px;height:36px;border:2.5px solid var(--bd2);border-top-color:var(--tx);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#err{display:none;background:#FCEBEB;border:0.5px solid #F7C1C1;border-radius:8px;padding:.875rem 1rem;font-size:13px;color:#791F1F;position:fixed;top:16px;right:16px;z-index:500;max-width:380px}
nav{width:216px;min-width:216px;background:var(--bg);border-right:0.5px solid var(--bd2);display:flex;flex-direction:column;padding:1rem 0;flex-shrink:0}
.logo{padding:0 1rem 1rem;font-size:15px;font-weight:600;border-bottom:0.5px solid var(--bd2);margin-bottom:.5rem;display:flex;align-items:center;gap:8px}
.li{width:28px;height:28px;background:#1a56db;border-radius:6px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;font-weight:700;flex-shrink:0}
.ls{color:var(--tx2);font-size:11px;font-weight:400;display:block;margin-top:1px}
.ni{display:flex;align-items:center;gap:9px;padding:.5rem 1rem;font-size:13px;color:var(--tx2);cursor:pointer;transition:all .1s;user-select:none}
.ni:hover,.ni.active{background:var(--bg2);color:var(--tx)}
.ni.active{font-weight:500}
.ni svg{opacity:.6;flex-shrink:0}
.ni.active svg{opacity:1}
.ni .ch{margin-left:auto;transition:transform .2s;opacity:.5}
.ni.open .ch{transform:rotate(180deg)}
.sn{overflow:hidden;max-height:0;transition:max-height .25s ease}
.sn.open{max-height:500px}
.sc{display:flex;align-items:center;gap:8px;padding:.35rem 1rem .35rem 1.5rem;font-size:12px;color:var(--tx2);cursor:pointer;transition:all .1s}
.sc:hover,.sc.active{background:var(--bg2);color:var(--tx)}
.sc.active{font-weight:500}
.sc .ca{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:500;flex-shrink:0}
.np{display:flex;align-items:center;gap:9px;padding:.5rem 1rem;font-size:13px;color:var(--tx2);cursor:pointer;transition:all .1s}
.np:hover,.np.active{background:var(--bg2);color:var(--tx)}
.np.active{font-weight:500}
.np svg{opacity:.6;flex-shrink:0}
.np.active svg{opacity:1}
.us{margin-top:auto;padding:.875rem 1rem;border-top:0.5px solid var(--bd2)}
.us .ul{font-size:11px;color:var(--tx2);margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}
.up{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:var(--r);cursor:pointer;border:0.5px solid var(--bd);background:var(--bg2)}
.up:hover{background:var(--bg3)}
main{flex:1;overflow-y:auto;padding:1.75rem}
h2{font-size:18px;font-weight:600}
.tb{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem;gap:12px;flex-wrap:wrap}
.tbl{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--r);padding:7px 14px;font-size:13px;cursor:pointer;color:var(--tx);font-family:inherit;transition:background .1s}
.btn:hover{background:var(--bg2)}
.btn.P{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn.P:hover{opacity:.88}
.btn.s{padding:5px 11px;font-size:12px}
.btn.D{border-color:#F7C1C1;color:#791F1F}
.btn.D:hover{background:#FCEBEB}
.btn.W{background:#085041;color:#fff;border-color:#085041}
.btn.L{background:#791F1F;color:#fff;border-color:#791F1F}
.btn.Q{background:#1a56db;color:#fff;border-color:#1a56db;display:inline-flex;align-items:center;gap:7px;font-weight:500}
.btn.Q:hover{background:#1447c0}
.card{background:var(--bg);border:0.5px solid var(--bd2);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:.75rem}
.mx{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:1.5rem}
.mx .m{background:var(--bg2);border-radius:var(--r);padding:1rem}
.mx .m .l{font-size:12px;color:var(--tx2);margin-bottom:5px}
.mx .m .v{font-size:24px;font-weight:600}
.mx .m.wm{background:#FAEEDA;border:0.5px solid #FAC775}
.mx .m.wm .l,.mx .m.wm .v{color:#633806}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.pill.lead{background:#E6F1FB;color:#0C447C}
.pill.qualified{background:#EAF3DE;color:#27500A}
.pill.proposal{background:#FAEEDA;color:#633806}
.pill.won{background:#E1F5EE;color:#085041}
.pill.lost{background:#FCEBEB;color:#791F1F}
.pill.admin{background:#EEEDFE;color:#3C3489}
.pill.rep{background:#E6F1FB;color:#185FA5}
.pill.inactive{background:#F1EFE8;color:#5F5E5A}
.pill.prospect{background:#EEEDFE;color:#3C3489;font-weight:500}
.btn.prospect-on{background:#EEEDFE;color:#3C3489;border-color:#B5B0F5;font-weight:500}
.btn.prospect-on:hover{background:#d8d6fc}
.pill.vs{background:#E6F1FB;color:#0C447C}
.pill.vd{background:#EEEDFE;color:#3C3489}
.pill.ov{background:#FCEBEB;color:#791F1F;display:inline-flex;align-items:center;gap:4px}
.pill.sn2{background:#FAEEDA;color:#633806;display:inline-flex;align-items:center;gap:4px}
.pill.qs{background:#E1F5EE;color:#085041;display:inline-flex;align-items:center;gap:4px}
.pill.qu{background:#F1EFE8;color:#5F5E5A;display:inline-flex;align-items:center;gap:4px}
table{width:100%;font-size:13px;border-collapse:collapse}
th{text-align:left;font-size:12px;font-weight:500;color:var(--tx2);padding:0 10px 10px;border-bottom:0.5px solid var(--bd2);white-space:nowrap;user-select:none}
th.r{text-align:right}
th.st{cursor:pointer}
th.st:hover,th.sd{color:var(--tx)}
td{padding:11px 10px;border-bottom:0.5px solid var(--bd2);color:var(--tx);vertical-align:middle}
td.r{text-align:right}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--bg2)}
tr.or td{border-left:3px solid #F7C1C1}
tr.sr td{border-left:3px solid #FAC775}
tr.or td:first-child,tr.sr td:first-child{padding-left:7px}
.tr td{border-top:1.5px solid var(--bd2);font-weight:600;background:var(--bg2);border-bottom:none}
.av{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;flex-shrink:0}
.avl{width:46px;height:46px;font-size:15px}
.av-blue{background:#E6F1FB;color:#0C447C}.av-teal{background:#E1F5EE;color:#085041}.av-purple{background:#EEEDFE;color:#3C3489}.av-coral{background:#FAECE7;color:#712B13}.av-amber{background:#FAEEDA;color:#633806}.av-green{background:#EAF3DE;color:#27500A}.av-gray{background:#F1EFE8;color:#5F5E5A}
.panel{position:fixed;top:0;right:0;width:440px;height:100vh;background:var(--bg);border-left:0.5px solid var(--bd2);z-index:100;overflow-y:auto;display:none;box-shadow:-4px 0 20px rgba(0,0,0,.06)}
.panel.open{display:block}
.ph{display:flex;justify-content:space-between;align-items:center;padding:1.25rem 1.5rem;border-bottom:0.5px solid var(--bd2);position:sticky;top:0;background:var(--bg);z-index:10}
.ph h3{font-size:15px;font-weight:600}
.pb{padding:1.5rem}
.cb{background:none;border:none;font-size:22px;cursor:pointer;color:var(--tx2);padding:2px 6px;line-height:1}
.fr{margin-bottom:1rem}
.fr label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px;font-weight:500}
.fr input,.fr select,.fr textarea{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit}
.dv{border:none;border-top:0.5px solid var(--bd2);margin:1.25rem 0}
.ti{display:flex;align-items:flex-start;gap:8px;padding:.5rem 0;border-bottom:0.5px solid var(--bd2)}
.ti:last-child{border-bottom:none}
.tt{font-size:13px}
.tt.done{text-decoration:line-through;color:var(--tx2)}
.td2{font-size:11px;color:var(--tx2);margin-top:2px}
.atr{display:flex;gap:6px;margin-top:.75rem;align-items:center}
.atr input{font-size:13px;padding:6px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit}
.srch{padding:7px 12px;font-size:13px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit}
.mb{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:center;justify-content:center}
.mb.open{display:flex}
.modal{background:var(--bg);border-radius:var(--rl);border:0.5px solid var(--bd2);padding:1.75rem;width:500px;max-width:96vw;max-height:90vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.12)}
.modal h3{font-size:16px;font-weight:600;margin-bottom:1.25rem}
.ma{display:flex;gap:8px;justify-content:flex-end;margin-top:1.5rem}
.mas{display:flex;justify-content:space-between;align-items:center;margin-top:1.5rem}
.st2{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.4px}
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.sh .st2{margin-bottom:0}
.empty{text-align:center;padding:2.5rem 2rem;color:var(--tx2);font-size:13px;line-height:1.6}
.tabs{display:flex;border-bottom:0.5px solid var(--bd2);margin-bottom:1.25rem}
.tab{padding:.5rem 1rem;font-size:13px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--tx)}
.tab.active{color:var(--tx);font-weight:500;border-bottom-color:var(--tx)}
.pt{display:flex;border-bottom:0.5px solid var(--bd2);margin-bottom:1.25rem}
.pti{padding:.5rem 1rem;font-size:13px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.pti:hover{color:var(--tx)}
.pti.active{color:var(--tx);font-weight:500;border-bottom-color:var(--tx)}
.oc{background:var(--bg2);border-radius:var(--r);padding:1rem;margin-bottom:.625rem;cursor:pointer;border:0.5px solid var(--bd2);transition:all .1s}
.oc:hover{border-color:var(--bd);background:var(--bg)}
.oc.ovc{border-left:3px solid #F7C1C1}
.oc.snc{border-left:3px solid #FAC775}
.ctr{display:flex;align-items:center;gap:10px;padding:.75rem 0;border-bottom:0.5px solid var(--bd2)}
.ctr:last-child{border-bottom:none}
.ctr .ci{flex:1;cursor:pointer}
.ctr .cn{font-size:13px;font-weight:500}
.ctr .cr{font-size:12px;color:var(--tx2)}
.ctr .crm{background:none;border:none;cursor:pointer;color:var(--tx2);padding:5px;border-radius:4px;opacity:0}
.ctr:hover .crm{opacity:1}
.ctr .crm:hover{color:#791F1F;background:#FCEBEB}
.ib{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;background:var(--bg2);color:var(--tx2);border:0.5px solid var(--bd2)}
.or2{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;border-bottom:0.5px solid var(--bd2);cursor:pointer;transition:background .1s}
.or2:hover{background:var(--bg2)}
.or2:last-child{border-bottom:none}
.or2.ovrl{border-left:3px solid #F7C1C1}
.or2.snrl{border-left:3px solid #FAC775}
.or2 .oi{flex:1}
.or2 .on{font-size:13.5px;font-weight:500}
.or2 .oco{font-size:12px;color:var(--tx2);margin-top:2px}
.vb{background:var(--bg2);border:0.5px solid var(--bd2);border-radius:var(--r);padding:1rem;margin-bottom:.75rem}
.vbt{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:.875rem;text-transform:uppercase;letter-spacing:.4px}
.vrg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.vr{border:0.5px solid var(--bd);border-radius:var(--r);padding:.75rem;cursor:pointer;text-align:center;transition:all .15s;background:var(--bg)}
.vr:hover{border-color:var(--tx2)}
.vr.vs2{background:#E6F1FB;border-color:#93BFEC;color:#0C447C}
.vr.vd2{background:#EEEDFE;border-color:#B5B0F5;color:#3C3489}
.vr .vi{font-size:20px;margin-bottom:5px}
.vr .vl{font-size:13px;font-weight:500}
.vr .vsu{font-size:11px;opacity:.7;margin-top:2px}
/* Q360 sync box */
.qsb{border:0.5px solid var(--bd2);border-radius:var(--r);padding:1rem;margin-bottom:.75rem;display:flex;align-items:center;justify-content:space-between;gap:12px}
.qsb.sy{background:#E1F5EE;border-color:#9FE1CB}
.qsb.usy{background:var(--bg2)}
.qsb .qsl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.qsb.sy .qsl{color:#085041}
.qsb.usy .qsl{color:var(--tx2)}
.qsb .qss{font-size:12px}
.qsb.sy .qss{color:#085041;opacity:.75}
.qsb.usy .qss{color:var(--tx2)}
.td3{background:var(--bg2);border-radius:var(--r);padding:.875rem 1rem;margin-bottom:1rem;display:flex;align-items:center;justify-content:space-between}
.tdl{font-size:12px;color:var(--tx2);font-weight:500}
.tdv{font-size:20px;font-weight:700}
.ai{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:.75rem}
.aig label{font-size:12px;color:var(--tx2);display:block;margin-bottom:4px;font-weight:500}
.aig input{width:100%;font-size:13px;padding:7px 8px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit}
.ts{border:0.5px solid var(--bd2);border-radius:var(--r);padding:1rem;margin-bottom:.75rem}
.ts .tst{font-size:12px;font-weight:600;color:var(--tx2);margin-bottom:.75rem;text-transform:uppercase;letter-spacing:.4px}
.ptt{background:var(--tx);color:var(--bg);border-radius:var(--rl);padding:1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between}
.ptl{font-size:13px;opacity:.7}
.pta{font-size:32px;font-weight:700;letter-spacing:-.5px}
.pts{font-size:12px;opacity:.55;margin-top:3px}
.sd2{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.ob{background:#FCEBEB;border:0.5px solid #F7C1C1;border-radius:var(--r);padding:1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:10px}
.obt{font-size:13px;color:#791F1F;font-weight:500}
.ns{border:0.5px solid var(--bd2);border-radius:var(--r);margin-bottom:.75rem;overflow:hidden}
.nsh{display:flex;align-items:center;padding:.75rem 1rem;background:var(--bg2);border-bottom:0.5px solid var(--bd2)}
.nsh .nst{font-size:12px;font-weight:600;color:var(--tx2);text-transform:uppercase;letter-spacing:.4px}
.ne{padding:.875rem 1rem;border-bottom:0.5px solid var(--bd2)}
.ne:last-child{border-bottom:none}
.net{font-size:13px;line-height:1.5}
.nem{font-size:11px;color:var(--tx2);margin-top:5px;display:flex;align-items:center;gap:6px}
.anb{padding:.875rem 1rem}
.anb textarea{width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);resize:none;height:70px;display:block;margin-bottom:8px;font-family:inherit}
.ana{display:flex;justify-content:flex-end}
.ctc{display:flex;align-items:center;gap:12px;padding:1rem;border-bottom:0.5px solid var(--bd2);cursor:pointer}
.ctc:hover{background:var(--bg2)}
.ctc:last-child{border-bottom:none}
.cti{flex:1}
.ctn{font-size:13.5px;font-weight:500}
.ctr2{font-size:12px;color:var(--tx2);margin-top:1px}
.ctco{display:inline-flex;align-items:center;gap:5px;margin-top:5px;font-size:11px;color:var(--tx2)}
.ctrg{text-align:right;flex-shrink:0}
.cte,.ctp{font-size:12px;color:var(--tx2);margin-top:2px}
.oxb{border-radius:var(--rl);padding:1.25rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:12px}
.oxb.wb{background:#E1F5EE;border:0.5px solid #9FE1CB}
.oxb.lb{background:#FCEBEB;border:0.5px solid #F7C1C1}
.oxi{font-size:30px;flex-shrink:0}
.oxt{font-size:15px;font-weight:600}
.oxb.wb .oxt{color:#085041}
.oxb.lb .oxt{color:#791F1F}
.oxs{font-size:12px;margin-top:2px;opacity:.75}
.oxb.wb .oxs{color:#085041}
.oxb.lb .oxs{color:#791F1F}
.rcs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.875rem}
.rc2{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--bd);cursor:pointer;background:var(--bg);color:var(--tx2);font-family:inherit}
.rc2.rw{background:#E1F5EE;border-color:#085041;color:#085041;font-weight:500}
.rc2.rl{background:#FCEBEB;border-color:#791F1F;color:#791F1F;font-weight:500}
.rb{display:inline-block;font-size:11px;padding:2px 9px;border-radius:20px;font-weight:500}
.rb.wr{background:#E1F5EE;color:#085041}
.rb.lr{background:#FCEBEB;color:#791F1F}
.cfb{background:#FCEBEB;border:0.5px solid #F7C1C1;border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.cfb p{font-size:13px;color:#4A1B0C;margin-bottom:.5rem;line-height:1.5}
.ur{display:flex;align-items:center;gap:12px;padding:1rem 1.25rem;border-bottom:0.5px solid var(--bd2)}
.ur:last-child{border-bottom:none}
.ur:hover{background:var(--bg2)}
.ur.ir{opacity:.55}
.ui{flex:1}

.ui .ue{font-size:12px;color:var(--tx2);margin-top:2px}
.ua{display:flex;gap:6px;align-items:center}
.sm{text-align:center;min-width:50px}

.fc{font-size:12px;padding:5px 12px;border-radius:20px;border:0.5px solid var(--bd);cursor:pointer;background:var(--bg);color:var(--tx2);font-family:inherit}
.fc:hover{border-color:var(--tx2);color:var(--tx)}
.fc.fa{background:var(--tx);color:var(--bg);border-color:var(--tx)}

.fl{font-size:12px;color:var(--tx2);font-weight:600}

<div id="loading"><div class="spin"></div><h2>Sprinter CRM</h2><p>Connecting to database…</p></div>
<div id="err"></div>
<div id="app" style="display:none">

<script>
const SB='https://jaltvtaodxfmzfdnzpeo.supabase.co/rest/v1';
const SK='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImphbHR2dGFvZHhmbXpmZG56cGVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMjgyODMsImV4cCI6MjA5MjkwNDI4M30.NluQoQXxVZl49KgSAkzbpJjmd0XLWL9AFZv4XpPvZA8';
const H={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json','Prefer':'return=representation'};
async function api(m,t,b,p=''){
  try{
    const r=await fetch(`${SB}/${t}${p?'?'+p:''}`,{method:m,headers:H,body:b?JSON.stringify(b):undefined});
    if(!r.ok)throw new Error(r.status+': '+(await r.text()));
    if(m==='DELETE'||r.status===204)return[];
    const tx=await r.text();return tx?JSON.parse(tx):[];
  }catch(e){showErr(e.message);throw e;}
}
const GET=(t,p)=>api('GET',t,null,p);
const POST=(t,b)=>api('POST',t,b);
const PAT=(t,b,p)=>api('PATCH',t,b,p);
const DEL=(t,p)=>api('DELETE',t,null,p);
function showErr(m){const b=document.getElementById('err');b.textContent='Error: '+m;b.style.display='block';setTimeout(()=>b.style.display='none',6000);}
function showSv(){const e=document.getElementById('svi');e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500);}

const COLS=['blue','teal','purple','coral','amber','green'];
const SC={lead:'#B5D4F4',qualified:'#C0DD97',proposal:'#FAC775',won:'#9FE1CB',lost:'#F7C1C1'};
const NOW=new Date();NOW.setHours(0,0,0,0);
const WR=['Champion buy-in','Competitive pricing','Better fit','Referral','Demo/POC success','Executive alignment','Other'];
const LR=['Price too high','Chose competitor','No budget','No decision made','Poor product fit','Timing','Other'];

const rc=()=>COLS[Math.floor(Math.random()*COLS.length)];
const ini=n=>(n||'?').split(' ').map(x=>x[0]).join('').toUpperCase().slice(0,2);
const fmt=n=>'$'+Number(n||0).toLocaleString();
const sl=s=>({lead:'Lead',qualified:'Qualified',proposal:'Proposal',won:'Won',lost:'Lost'}[s]||s);
const ta=o=>(o.hw_amount||0)+(o.sw_amount||0)+(o.labor_amount||0);
const taFmt=o=>{const t=ta(o);return t===0?'TBD':fmt(t);};
const taKFmt=o=>{const t=ta(o);return t===0?'TBD':'$'+Math.round(t/1000)+'k';};
const chex=c=>({blue:'#93BFEC',teal:'#6DD4B0',purple:'#B5B0F5',coral:'#F5A48B',amber:'#FAC775',green:'#9FE1CB',gray:'#ccc'}[c]||'#ccc');
const fd=i=>{if(!i)return'—';const[y,m,d]=i.split('-').map(Number);return`${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][m-1]} ${d}, ${y}`;};
const tsN=()=>new Date().toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'});
function ds(o){if(['won','lost'].includes(o.stage)||!o.close_date)return null;const df=Math.floor((new Date(o.close_date+'T00:00:00')-NOW)/86400000);return df<0?'overdue':df<=7?'soon':null;}
function dB(o){const s=ds(o);if(!s)return'';const df=Math.floor((new Date(o.close_date+'T00:00:00')-NOW)/86400000);if(s==='overdue')return`<span class="pill ov"><svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>${Math.abs(df)}d overdue</span>`;const l=df===0?'Today':df===1?'Tomorrow':`${df}d`;return`<span class="pill sn2"><svg width="10" height="10" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg>Closes ${l}</span>`;}
const vB=o=>o.verkada_deal_reg?'<span class="pill vd" style="font-size:10px">Deal Reg</span>':o.verkada_sourced?'<span class="pill vs" style="font-size:10px">Sourced</span>':'';
const qB=o=>o.q360_synced?`<span class="pill qs" style="font-size:10px"><svg width="9" height="9" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M5 13l4 4L19 7"/></svg>Q360 Synced</span>`:`<span class="pill qu" style="font-size:10px">Not Synced</span>`;

const S={uid:null,view:'companies',q:'',fo:'',ut:'active',co:true,oo:true,pt:{},sf:'',qf:'',sc:null,psf:'',pqf:'',esf:'all',cq:'',ps:{c:'stage',d:'asc'},users:[],companies:[]};
const cu=()=>S.users.find(u=>u.id===S.uid);
const isA=()=>cu()?.role==='admin';
const au=()=>S.users.filter(u=>u.active);
const oN=id=>S.users.find(u=>u.id===id)?.name||'Unassigned';
const oC=id=>S.users.find(u=>u.id===id)?.color||'gray';
const oAv=id=>{const u=S.users.find(u=>u.id===id);return u?u.avatar||ini(u.name):'?';};

const lC=id=>S.companies.find(x=>x.id===id);
const lO=(c,o)=>lC(c)?.opportunities?.find(x=>x.id===o);

function allCT(){const out=[];myC().forEach(c=>(c.contacts||[]).forEach(ct=>out.push({...ct,cid:c.id,cn:c.name,cc:c.color})));if(S.cq){const q=S.cq.toLowerCase();return out.filter(ct=>[ct.name,ct.role,ct.email,ct.cn].some(v=>(v||'').toLowerCase().includes(q)));}return out;}
function vCs(){let cs=myC();if(S.fo)cs=cs.filter(c=>c.owner_id===S.fo);if(S.q)cs=cs.filter(c=>c.name.toLowerCase().includes(S.q.toLowerCase())||(c.industry||'').toLowerCase().includes(S.q.toLowerCase()));return cs;}
function vOs(){const cos=S.sc?myC().filter(c=>c.id===S.sc):myC();let all=cos.flatMap(c=>(c.opportunities||[]).map(o=>({...o,cid:c.id,cname:c.name,owner_id:c.owner_id})));if(S.q)all=all.filter(o=>o.name.toLowerCase().includes(S.q.toLowerCase())||o.cname.toLowerCase().includes(S.q.toLowerCase()));if(S.qf==='synced')all=all.filter(o=>o.q360_synced);if(S.qf==='unsynced')all=all.filter(o=>!o.q360_synced);return all;}
function pOs(){let all=myC().flatMap(c=>(c.opportunities||[]).map(o=>({...o,cid:c.id,cname:c.name,owner_id:c.owner_id})));if(S.fo)all=all.filter(o=>o.owner_id===S.fo);if(S.psf)all=all.filter(o=>o.stage===S.psf);if(S.pqf==='synced')all=all.filter(o=>o.q360_synced);if(S.pqf==='unsynced')all=all.filter(o=>!o.q360_synced);return all;}
function srtP(op){const{c,d}=S.ps;const m=d==='asc'?1:-1;return op.slice().sort((a,b)=>{if(c==='name')return m*a.name.localeCompare(b.name);if(c==='company')return m*a.cname.localeCompare(b.cname);if(c==='stage'){const r={lead:0,qualified:1,proposal:2,won:3,lost:4};return m*((r[a.stage]||0)-(r[b.stage]||0));}if(c==='cd'){return m*((a.close_date||'9999')<(b.close_date||'9999')?-1:1);}if(c==='prob')return m*(a.probability-b.probability);if(c==='tot')return m*(ta(a)-ta(b));return 0;});}
function setPS(c){if(S.ps.c===c)S.ps.d=S.ps.d==='asc'?'desc':'asc';else{S.ps.c=c;S.ps.d='asc';}render();}
const sa=c=>{const{c:cc,d}=S.ps;if(cc!==c)return'<span class="sx">↕</span>';return`<span class="sx ${cc===c?'sxd':''}">${d==='asc'?'↑':'↓'}</span>`;};

async function loadAll(){
  try{
    const[users,companies,contacts,opps,oN2,oT,cN]=await Promise.all([GET('users','order=name'),GET('companies','order=name'),GET('contacts','order=name'),GET('opportunities','order=created_at'),GET('opportunity_notes','select=*&order=created_at.desc'),GET('opportunity_tasks','order=created_at'),GET('company_notes','order=created_at.desc')]);

}

const oSel=oc=>{if(!isA())return'';const opts=au().filter(u=>u.role==='rep').map(u=>`<option value="${u.id}" ${S.fo===u.id?'selected':''}>${u.name}</option>`).join('');return`<select onchange="${oc}" style="font-size:13px;padding:6px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit"><option value="">All reps</option>${opts}</select>`;};

function rCs(){
  const cs=vCs(),all=myC();

  const un=all.flatMap(c=>c.opportunities||[]).filter(o=>!o.q360_synced).length;
  return`<div class="tb"><div class="tbl"><h2>Customers</h2>${oSel("S.fo=this.value;render()")}</div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <button class="btn Q" onclick="openQ360()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>Export to Q360</button>
      <input class="srch" placeholder="Search…" value="${S.q}" oninput="S.q=this.value;render()" style="width:180px">
      <button class="btn P" onclick="openAddC()">+ Add company</button>
    </div></div>
  ${ov>0?`<div class="ob"><svg width="18" height="18" fill="none" viewBox="0 0 24 24" stroke="#791F1F" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div><div class="obt">${ov} overdue deal${ov!==1?'s':''}</div></div><button class="btn s" style="margin-left:auto;flex-shrink:0" onclick="showAO()">View →</button></div>`:''}
  <div class="mx"><div class="m"><div class="l">Companies</div><div class="v">${all.length}</div></div><div class="m"><div class="l">Opportunities</div><div class="v">${all.flatMap(c=>c.opportunities||[]).length}</div></div><div class="m"><div class="l">Open pipeline</div><div class="v">$${Math.round(pipe/1000)}k</div></div><div class="m ${un>0?'wm':''}"><div class="l">${un>0?'⚠ Not synced Q360':'Total won'}</div><div class="v">${un>0?un:'$'+Math.round(won/1000)+'k'}</div></div></div>

}

function rOs(){
  const c=S.sc?lC(S.sc):null;
  const opps=vOs();const fil=S.sf?opps.filter(o=>o.stage===S.sf):opps;

async function togProspect(cid){const c=lC(cid);if(!c)return;const val=!c.is_prospect;await dBC({is_prospect:val},cid);c.is_prospect=val;render();openC(cid,'overview');}
async function saveC(cid){const c=lC(cid);if(!c)return;const name=document.getElementById('cn')?.value?.trim()||c.name;const pros=document.getElementById('cpros')?.checked||false;const data={name,industry:document.getElementById('ci')?.value,hq_address:document.getElementById('ch')?.value,website:document.getElementById('cw')?.value,phone:document.getElementById('cp2')?.value,city:document.getElementById('cc2')?.value,is_prospect:pros};if(isA()){const oe=document.getElementById('co2');if(oe)data.owner_id=oe.value;}await dBC(data,cid);Object.assign(c,data);document.getElementById('pt').textContent=c.name;openC(cid,'overview');render();}
function confirmDelC(cid){const c=lC(cid);if(!c)return;const oc=(c.opportunities||[]).length,cc=(c.contacts||[]).length;showM(`<h3>Delete ${c.name}?</h3><div class="cfb"><p>Permanently delete this company and all its data.</p>${oc?`<p>${oc} opportunit${oc!==1?'ies':'y'} will be deleted.</p>`:''} ${cc?`<p>${cc} contact${cc!==1?'s':''} will be deleted.</p>`:''}</div><div class="mas"><button class="btn" onclick="closeM()">Cancel</button><button class="btn D" onclick="delC('${cid}')">Delete permanently</button></div>`);}
async function delC(cid){await dBdC(cid);S.companies=S.companies.filter(c=>c.id!==cid);closeM();closePanel();S.sc=null;show('companies');}
async function rmContact(cid,ctid){const c=lC(cid);const ct=c?.contacts?.find(x=>x.id===ctid);if(!ct||!confirm(`Remove ${ct.name}?`))return;await dBdCt(ctid);c.contacts=c.contacts.filter(x=>x.id!==ctid);openC(cid,'contacts');if(S.view==='contacts')render();}
async function addCN(cid){const inp=document.getElementById('ni-'+cid);if(!inp||!inp.value.trim())return;const c=lC(cid);if(!c)return;const note=await dBCN(cid,inp.value.trim());if(!c.notes)c.notes=[];c.notes.unshift(note);openC(cid,'activity');}
async function delCN(cid,nid){const c=lC(cid);if(!c)return;await DEL('company_notes',`id=eq.${nid}`);c.notes=c.notes.filter(n=>n.id!==nid);openC(cid,'activity');}

function tskH(cid,oid,tasks,ce){tasks=tasks||[];return`<div class="ts"><div class="tst">Tasks${tasks.length?` — ${tasks.filter(t=>!t.done).length} open`:''}</div>${tasks.map(t=>`<div class="ti"><input type="checkbox" ${t.done?'checked':''} ${ce?`onchange="togT('${cid}','${oid}','${t.id}',this.checked)"`:'disabled'} style="cursor:pointer;width:16px;height:16px;flex-shrink:0"><div style="flex:1"><div class="tt ${t.done?'done':''}">${t.text}</div><div class="td2" id="tdue-${t.id}">Due ${t.due_date||'TBD'}${ce?` <button onclick="editDue('${cid}','${oid}','${t.id}','${t.due_date||''}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--tx2);padding:0 4px" title="Edit date">✏️</button>`:''}</div></div>${ce?`<button onclick="delT('${cid}','${oid}','${t.id}')" style="background:none;border:none;cursor:pointer;font-size:11px;color:var(--tx2);padding:3px 7px;border-radius:4px;flex-shrink:0" onmouseover="this.style.color='#791F1F';this.style.background='#FCEBEB'" onmouseout="this.style.color='var(--tx2)';this.style.background='none'">Delete</button>`:''}</div>`).join('')}${!tasks.length?'<div style="font-size:13px;color:var(--tx2);padding:.5rem 0">No tasks yet.</div>':''}${ce?`<div class="atr"><input id="tt-${oid}" placeholder="New task…" style="flex:1"><input id="td-${oid}" type="date" style="max-width:130px"><button class="btn s" onclick="addT('${cid}','${oid}')">Add</button></div>`:''}</div>`;}
function notH(cid,oid,notes,ce){notes=notes||[];const u=cu();return`<div class="ns"><div class="nsh"><span class="nst">Notes${notes.length?` (${notes.length})`:''}</span></div>${notes.length?notes.map(n=>`<div class="ne"><div class="net">${n.text}</div><div class="nem"><div style="width:7px;height:7px;border-radius:50%;background:${chex(n.author_color||'gray')}"></div><span>${n.author}</span><span style="opacity:.4">·</span><span>${new Date(n.created_at).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</span>${ce&&n.author===u?.name?`<button onclick="delN('${cid}','${oid}','${n.id}')" style="margin-left:auto;background:none;border:none;cursor:pointer;font-size:11px;color:var(--tx2)">Delete</button>`:''}</div></div>`).join(''):'<div style="font-size:13px;color:var(--tx2);padding:.875rem 1rem">No notes yet.</div>'}${ce?`<div class="anb"><textarea id="nt-${oid}" placeholder="Add a note…"></textarea><div class="ana"><button class="btn s P" onclick="addN('${cid}','${oid}')">Add note</button></div></div>`:''}</div>`;}
function vrkH(cid,oid,o,ce){const ct=o.verkada_deal_reg?'dealreg':o.verkada_sourced?'sourced':null;if(!ce){if(ct==='sourced')return`<div class="vb"><div class="vbt">Verkada</div><span class="pill vs">Verkada Sourced</span></div>`;if(ct==='dealreg')return`<div class="vb"><div class="vbt">Verkada</div><span class="pill vd">Verkada Deal Reg</span></div>`;return'';}return`<div class="vb"><div class="vbt">Verkada</div><div class="vrg"><div class="vr ${ct==='sourced'?'vs2':''}" onclick="setVrk('${cid}','${oid}','sourced')"><div class="vi">🔵</div><div class="vl">Verkada Sourced</div><div class="vsu">Sourced through Verkada</div></div><div class="vr ${ct==='dealreg'?'vd2':''}" onclick="setVrk('${cid}','${oid}','dealreg')"><div class="vi">🟣</div><div class="vl">Verkada Deal Reg</div><div class="vsu">Deal registration submitted</div></div></div>${ct?`<div style="margin-top:.75rem;text-align:right"><button class="btn s" onclick="setVrk('${cid}','${oid}','none')">Clear</button></div>`:''}</div>`;}
function q360H(cid,oid,o,ce){const sy=o.q360_synced;return`<div class="qsb ${sy?'sy':'usy'}"><div><div class="qsl">${sy?'✓ Synced to Q360':'Not yet synced to Q360'}</div><div class="qss">${sy?'Exported to Q360':'Export to Q360 to sync'}</div></div>${ce?`<button class="btn s ${sy?'D':'Q'}" onclick="togQ('${cid}','${oid}',${!sy})">${sy?'Mark unsynced':'Mark synced'}</button>`:''}</div>`;}

function openOP(cid,oid){
  const c=lC(cid);const o=lO(cid,oid);if(!c||!o)return;
  const ce=isA()||c.owner_id===S.uid;const tot=ta(o);const st=ds(o);const isCl=o.stage==='won'||o.stage==='lost';
  document.getElementById('pt').textContent=o.name;
  document.getElementById('pb').innerHTML=`
    <div style="margin-bottom:1.5rem"><div style="font-size:13px;color:var(--tx2);margin-bottom:5px;cursor:pointer" onclick="openC('${cid}','opps')">← ${c.name}</div>
      <div style="font-size:26px;font-weight:700">${tot===0?'TBD':fmt(tot)}</div>
      <div style="font-size:12px;color:var(--tx2);margin-top:4px">HW ${fmt(o.hw_amount||0)} · SW ${fmt(o.sw_amount||0)} · Labor ${fmt(o.labor_amount||0)}</div>
    </div>
    ${st==='overdue'?`<div class="ob"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#791F1F" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg><div style="font-size:13px;color:#791F1F;font-weight:500">Overdue — close date was ${fd(o.close_date)}</div></div>`:st==='soon'?`<div style="background:#FAEEDA;border:0.5px solid #FAC775;border-radius:var(--r);padding:.875rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:8px"><svg width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#633806" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 3"/></svg><div style="font-size:13px;color:#633806;font-weight:500">Closing soon — ${fd(o.close_date)}</div></div>`:''}
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:1.25rem">
      <div style="background:var(--bg2);border-radius:var(--r);padding:1rem"><div style="font-size:12px;color:var(--tx2);margin-bottom:7px">Stage</div><span class="pill ${o.stage}">${sl(o.stage)}</span></div>
      <div style="background:var(--bg2);border-radius:var(--r);padding:1rem"><div style="font-size:12px;color:var(--tx2);margin-bottom:5px">Probability</div><div style="font-size:17px;font-weight:600">${o.probability}%</div></div>
      <div style="background:${st==='overdue'?'#FAEEDA':'var(--bg2)'};border-radius:var(--r);padding:1rem;${st==='overdue'?'border:0.5px solid #FAC775':''}"><div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px"><div style="font-size:12px;color:${st==='overdue'?'#633806':'var(--tx2)'}">Close date</div>${ce?`<button onclick="editCloseDate('${cid}','${oid}')" style="background:none;border:none;cursor:pointer;font-size:10px;color:var(--tx2);padding:0" title="Edit close date">✏️</button>`:''}</div><div style="font-size:15px;font-weight:600;color:${st==='overdue'?'#791F1F':'var(--tx)'}">${o.close_date?fd(o.close_date):'—'}</div></div>
      <div style="background:var(--bg2);border-radius:var(--r);padding:1rem"><div style="font-size:12px;color:var(--tx2);margin-bottom:5px">Created</div><div style="font-size:13px;font-weight:500;color:var(--tx)">${o.created_at?new Date(o.created_at).toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric'}):'—'}</div></div>
    </div>
    ${q360H(cid,oid,o,ce)}
    ${isCl&&ce?`<div style="background:var(--bg2);border:0.5px solid var(--bd2);border-radius:var(--r);padding:1rem;margin-bottom:.75rem"><div class="st2" style="margin-bottom:.625rem">${o.stage==='won'?'🏆 Won':'❌ Lost'} Reason</div>${o.close_reason?`<span class="rb ${o.stage==='won'?'wr':'lr'}">${o.close_reason}</span>`:'<span style="font-size:13px;color:var(--tx2)">No reason recorded</span>'}<button class="btn s" style="display:block;margin-top:.75rem" onclick="prOtc('${cid}','${oid}','${o.stage}',true)">Edit reason</button></div>`:''}
    ${vrkH(cid,oid,o,ce)}
    ${tskH(cid,oid,o.tasks,ce)}
    ${notH(cid,oid,o.notes,ce)}
    ${ce?`<hr class="dv"><div class="st2">Move stage</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:1.25rem">
      ${['lead','qualified','proposal'].map(s=>`<button class="btn s ${o.stage===s?'P':''}" onclick="mvO('${cid}','${oid}','${s}')">${sl(s)}</button>`).join('')}
      <button class="btn s ${o.stage==='won'?'W':''}" onclick="hSt('${cid}','${oid}','won')">Won</button>
      <button class="btn s ${o.stage==='lost'?'L':''}" onclick="hSt('${cid}','${oid}','lost')">Lost</button>
    </div>
    <hr class="dv"><div class="st2">Edit details</div>
    <div class="fr"><label>Opportunity name</label><input id="en" value="${o.name.replace(/"/g,'&quot;')}"></div>
    <div class="ai"><div class="aig"><label>Hardware ($)</label><input id="eh" value="${o.hw_amount||''}" type="number" placeholder="Optional" oninput="rT()"></div><div class="aig"><label>Software ($)</label><input id="es" value="${o.sw_amount||''}" type="number" placeholder="Optional" oninput="rT()"></div><div class="aig"><label>Labor ($)</label><input id="el" value="${o.labor_amount||''}" type="number" placeholder="Optional" oninput="rT()"></div></div>
    <div class="td3"><span class="tdl">Total (auto-calculated)</span><span class="tdv" id="etd">${tot===0?'TBD':fmt(tot)}</span></div>
    <div class="fr"><label>Close date</label><input id="ed" type="date" value="${o.close_date||''}"></div>
    <div class="fr"><label>Probability (%)</label><input id="ep" value="${o.probability}" type="number" min="0" max="100"></div>
    <div style="display:flex;justify-content:space-between;margin-top:.75rem"><button class="btn s D" onclick="delO('${cid}','${oid}')">Delete opportunity</button><button class="btn s P" onclick="saveO('${cid}','${oid}')">Save changes</button></div>`:''}`;
  document.getElementById('panel').classList.add('open');
}

function rT(){const h=parseInt(document.getElementById('eh')?.value)||0;const s=parseInt(document.getElementById('es')?.value)||0;const l=parseInt(document.getElementById('el')?.value)||0;const d=document.getElementById('etd');if(d)d.textContent=(h+s+l)===0?'TBD':fmt(h+s+l);}
function editCloseDate(cid,oid){const o=lO(cid,oid);if(!o)return;showM(`<h3>Edit close date</h3><div class="fr"><label>Close date</label><input id="ecd" type="date" value="${o.close_date||''}" style="font-size:14px;padding:8px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit;width:100%"></div><div class="ma"><button class="btn" onclick="closeM()">Cancel</button><button class="btn s D" onclick="saveCloseDate('${cid}','${oid}',null)">Clear date</button><button class="btn P" onclick="saveCloseDate('${cid}','${oid}',document.getElementById('ecd').value)">Save</button></div>`);}
async function saveCloseDate(cid,oid,val){const o=lO(cid,oid);if(!o)return;await dBO({close_date:val||null},oid);o.close_date=val||null;closeM();openOP(cid,oid);if(['pipeline','opportunities'].includes(S.view))render();}
async function saveO(cid,oid){const o=lO(cid,oid);if(!o)return;const data={name:document.getElementById('en')?.value?.trim()||o.name,hw_amount:parseInt(document.getElementById('eh').value)||0,sw_amount:parseInt(document.getElementById('es').value)||0,labor_amount:parseInt(document.getElementById('el').value)||0,close_date:document.getElementById('ed').value||null,probability:parseInt(document.getElementById('ep').value)||o.probability};await dBO(data,oid);Object.assign(o,data);document.getElementById('pt').textContent=o.name;openOP(cid,oid);if(['pipeline','opportunities'].includes(S.view))render();}
async function mvO(cid,oid,stage){const o=lO(cid,oid);if(!o)return;await dBO({stage},oid);o.stage=stage;openOP(cid,oid);if(['pipeline','opportunities'].includes(S.view))render();}
async function delO(cid,oid){if(!confirm('Delete this opportunity?'))return;await dBdO(oid);const c=lC(cid);if(c)c.opportunities=c.opportunities.filter(o=>o.id!==oid);closePanel();if(['pipeline','opportunities'].includes(S.view))render();}
async function setVrk(cid,oid,type){const o=lO(cid,oid);if(!o)return;const data={verkada_sourced:type==='sourced',verkada_deal_reg:type==='dealreg'};await dBO(data,oid);Object.assign(o,data);openOP(cid,oid);if(['pipeline','opportunities'].includes(S.view))render();}
async function addN(cid,oid){const ta=document.getElementById(`nt-${oid}`);if(!ta||!ta.value.trim())return;const o=lO(cid,oid);if(!o)return;const u=cu();const note=await dBN(oid,ta.value.trim(),u.name,u.color);if(!o.notes)o.notes=[];o.notes.unshift(note);openOP(cid,oid);}
async function delN(cid,oid,nid){const o=lO(cid,oid);if(!o)return;await dBdN(nid);o.notes=o.notes.filter(n=>n.id!==nid);openOP(cid,oid);}
async function addT(cid,oid){const te=document.getElementById(`tt-${oid}`);const de=document.getElementById(`td-${oid}`);if(!te||!te.value.trim())return;const o=lO(cid,oid);if(!o)return;const task=await dBT(oid,te.value.trim(),de?.value||null);if(!o.tasks)o.tasks=[];o.tasks.push(task);openOP(cid,oid);}
async function togT(cid,oid,tid,done){const o=lO(cid,oid);if(!o)return;await dBtT(tid,done);const t=o.tasks.find(x=>x.id===tid);if(t)t.done=done;openOP(cid,oid);}
async function delT(cid,oid,tid){const o=lO(cid,oid);if(!o)return;showSv();await DEL('opportunity_tasks',`id=eq.${tid}`);o.tasks=o.tasks.filter(t=>t.id!==tid);openOP(cid,oid);}
function editDue(cid,oid,tid,cur){showM(`<h3>Edit due date</h3><div class="fr"><label>Due date</label><input id="eduedt" type="date" value="${cur}" style="font-size:14px;padding:8px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);font-family:inherit;width:100%"></div><div class="ma"><button class="btn" onclick="closeM()">Cancel</button><button class="btn s D" onclick="saveDue('${cid}','${oid}','${tid}',null)">Clear date</button><button class="btn P" onclick="saveDue('${cid}','${oid}','${tid}',document.getElementById('eduedt').value)">Save</button></div>`);}
async function saveDue(cid,oid,tid,val){const o=lO(cid,oid);if(!o)return;showSv();await PAT('opportunity_tasks',{due_date:val||null},`id=eq.${tid}`);const t=o.tasks.find(x=>x.id===tid);if(t)t.due_date=val||null;closeM();openOP(cid,oid);}
function hSt(cid,oid,stage){const o=lO(cid,oid);if(!o||o.stage===stage)return;if(stage==='won'||stage==='lost')prOtc(cid,oid,stage,false);else mvO(cid,oid,stage);}

let _po=null;let _sr='';
function prOtc(cid,oid,stage,edit=false){
  _po={cid,oid,stage,edit};_sr='';
  const o=lO(cid,oid);const iW=stage==='won';const rs=iW?WR:LR;const ex=o?.close_reason||'';if(ex)_sr=ex;
  showM(`<div class="oxb ${iW?'wb':'lb'}"><div class="oxi">${iW?'🏆':'❌'}</div><div><div class="oxt">${edit?'Edit reason':'Mark as '+(iW?'Won':'Lost')}</div><div class="oxs">${iW?'What drove this win?':'What happened?'}</div></div></div>
    <div class="fr"><label style="font-size:12px;color:var(--tx2);display:block;margin-bottom:4px;font-weight:500">Reason <span style="opacity:.5;font-weight:400">(optional)</span></label><div class="rcs">${rs.map(r=>`<div class="rc2 ${ex===r?(iW?'rw':'rl'):''}" id="rc-${r.replace(/[\s/]/g,'-')}" onclick="selR('${r}')">${r}</div>`).join('')}</div></div>
    ${!edit?`<div class="fr"><label style="font-size:12px;color:var(--tx2);display:block;margin-bottom:4px;font-weight:500">Notes <span style="opacity:.5;font-weight:400">(optional)</span></label><textarea id="on" style="width:100%;font-size:13px;padding:8px 10px;border:0.5px solid var(--bd);border-radius:var(--r);background:var(--bg);color:var(--tx);resize:none;height:80px;font-family:inherit" placeholder="${iW?'What made the difference?':'Any additional context?'}"></textarea></div>`:''}
    <div class="ma"><button class="btn" onclick="closeM()">Cancel</button>${edit&&ex?`<button class="btn D" onclick="clrR('${cid}','${oid}')">Clear reason</button>`:''}
    <button class="btn ${iW?'W':'L'}" onclick="cfmO()">${edit?'Save reason':'Confirm '+(iW?'Won':'Lost')}</button></div>`);
}
function selR(r){_sr=r;const iW=_po?.stage==='won';document.querySelectorAll('.rc2').forEach(el=>{el.className='rc2';});const el=document.getElementById(`rc-${r.replace(/[\s/]/g,'-')}`);if(el)el.className=`rc2 ${iW?'rw':'rl'}`;}
async function cfmO(){
  if(!_po)return;const{cid,oid,stage,edit}=_po;
  const o=lO(cid,oid);if(!o)return;
  const data={close_reason:_sr||null};
  if(!edit){data.stage=stage;if(stage==='won')data.probability=100;if(stage==='lost')data.probability=0;}
  await dBO(data,oid);Object.assign(o,data);
  if(!edit){const nt=document.getElementById('on')?.value?.trim();if(nt){const u=cu();const note=await dBN(oid,`[${stage==='won'?'Won':'Lost'}${_sr?' · '+_sr:''}] ${nt}`,u.name,u.color);if(!o.notes)o.notes=[];o.notes.unshift(note);}}
  closeM();openOP(cid,oid);if(['pipeline','opportunities'].includes(S.view))render();
}
async function clrR(cid,oid){const o=lO(cid,oid);if(!o)return;await dBO({close_reason:null},oid);o.close_reason=null;closeM();openOP(cid,oid);}

function openCTP(cid,ctid){
  const c=lC(cid);const ct=c?.contacts?.find(x=>x.id===ctid);if(!c||!ct)return;
  const ce=isA()||c.owner_id===S.uid;
  document.getElementById('pt').textContent=ct.name;
  document.getElementById('pb').innerHTML=`<div style="display:flex;align-items:center;gap:14px;margin-bottom:1.5rem"><div class="av av-blue avl">${ini(ct.name)}</div><div><div style="font-size:17px;font-weight:600">${ct.name}</div><div style="font-size:13px;color:var(--tx2);margin-top:3px">${ct.role||'—'}</div><div style="margin-top:8px;cursor:pointer;display:inline-flex;align-items:center;gap:5px" onclick="openC('${cid}')"><div style="width:8px;height:8px;border-radius:50%;background:${chex(c.color)}"></div><span style="font-size:12px;color:var(--tx2);text-decoration:underline">${c.name}</span></div></div></div>
  <div class="fr"><label style="font-size:12px;color:var(--tx2);display:block;margin-bottom:4px;font-weight:500">Email</label><span style="font-size:13.5px"><a href="mailto:${ct.email||''}">${ct.email||'—'}</a></span></div>
  <div class="fr"><label style="font-size:12px;color:var(--tx2);display:block;margin-bottom:4px;font-weight:500">Phone</label><span style="font-size:13.5px">${ct.phone||'—'}</span></div>
  ${ce?`<hr class="dv"><div class="st2">Edit contact</div><div class="fr"><label>Full name</label><input id="cen" value="${ct.name}"></div><div class="fr"><label>Role / Title</label><input id="cer" value="${ct.role||''}"></div><div class="fr"><label>Email</label><input id="cee" value="${ct.email||''}"></div><div class="fr"><label>Phone</label><input id="cep" value="${ct.phone||''}"></div><div style="display:flex;justify-content:space-between;margin-top:.75rem"><button class="btn s D" onclick="delCT('${cid}','${ctid}')">Delete contact</button><button class="btn s P" onclick="saveCT('${cid}','${ctid}')">Save</button></div>`:''}`;
  document.getElementById('panel').classList.add('open');
}
async function saveCT(cid,ctid){const c=lC(cid);const ct=c?.contacts?.find(x=>x.id===ctid);if(!ct)return;const data={name:document.getElementById('cen').value.trim()||ct.name,role:document.getElementById('cer').value,email:document.getElementById('cee').value,phone:document.getElementById('cep').value};await dBCt(data,ctid);Object.assign(ct,data);openCTP(cid,ctid);if(S.view==='contacts')render();}

function openQ360(){S.esf='all';renderQ360(false);document.getElementById('mb').classList.add('open');}
function renderQ360(ex){
  const cos=myC();let all=cos.flatMap(c=>(c.opportunities||[]).map(o=>({...o,cname:c.name,hq:c.hq_address,ind:c.industry,own:oN(c.owner_id),cid:c.id})));
  if(S.esf==='open')all=all.filter(o=>!['won','lost'].includes(o.stage));else if(S.esf==='won')all=all.filter(o=>o.stage==='won');else if(S.esf==='lost')all=all.filter(o=>o.stage==='lost');else if(S.esf==='unsynced')all=all.filter(o=>!o.q360_synced);
  const tot=all.reduce((a,o)=>a+ta(o),0);const un=all.filter(o=>!o.q360_synced).length;
  document.getElementById('md').innerHTML=`<h3>Export to Q360</h3>${ex?`<div style="background:#E1F5EE;border:0.5px solid #9FE1CB;border-radius:var(--r);padding:1rem;margin-bottom:1rem;font-size:13px;color:#085041;font-weight:500">✓ CSV downloaded and ${all.length} opportunit${all.length!==1?'ies':'y'} marked as synced.</div>`:''}
    <div style="display:flex;gap:8px;margin-bottom:1.25rem;flex-wrap:wrap">${[['all','All'],['open','Open only'],['won','Won only'],['lost','Lost only'],['unsynced','Not Synced ✦']].map(([v,l])=>`<div class="fc ${S.esf===v?(v==='unsynced'?'fq':'fa'):''}" onclick="S.esf='${v}';renderQ360(false)">${l}</div>`).join('')}</div>

      <div style="background:var(--bg2);border-radius:var(--r);padding:1rem"><div style="font-size:11px;color:var(--tx2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Opportunities</div><div style="font-size:22px;font-weight:600">${all.length}</div></div>
      <div style="background:var(--bg2);border-radius:var(--r);padding:1rem"><div style="font-size:11px;color:var(--tx2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Total value</div><div style="font-size:22px;font-weight:600">${fmt(tot)}</div></div>
      <div style="background:${un>0?'#FAEEDA':'var(--bg2)'};border-radius:var(--r);padding:1rem;${un>0?'border:0.5px solid #FAC775':''}"><div style="font-size:11px;color:${un>0?'#633806':'var(--tx2)'};margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px">Not yet synced</div><div style="font-size:22px;font-weight:600;color:${un>0?'#633806':'var(--tx)'}">${un}</div></div>
    </div>
    <p style="font-size:12px;color:var(--tx2);margin-bottom:1.25rem">After downloading, all exported opportunities will be automatically marked as <strong>Synced to Q360</strong>.</p>
    <div class="ma"><button class="btn" onclick="closeM()">Cancel</button><button class="btn Q" onclick="doExport()"><svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M12 15V3m0 12l-4-4m4 4l4-4M2 17l.621 2.485A2 2 0 004.561 21h14.878a2 2 0 001.94-1.515L22 17"/></svg>Download CSV for Q360</button></div>`;
}
async function doExport(){
  const cos=myC();let all=cos.flatMap(c=>(c.opportunities||[]).map(o=>({...o,cname:c.name,hq:c.hq_address,ind:c.industry,own:oN(c.owner_id),cid:c.id})));
  if(S.esf==='open')all=all.filter(o=>!['won','lost'].includes(o.stage));else if(S.esf==='won')all=all.filter(o=>o.stage==='won');else if(S.esf==='lost')all=all.filter(o=>o.stage==='lost');else if(S.esf==='unsynced')all=all.filter(o=>!o.q360_synced);
  const hdrs=['Opportunity Name','Company','Industry','HQ Address','Stage','Close Reason','Hardware ($)','Software ($)','Labor ($)','Total ($)','Probability (%)','Close Date','Verkada','Owner','Q360 Synced'];
  const rows=all.map(o=>[`"${o.name}"`,`"${o.cname}"`,`"${o.ind||''}"`,`"${o.hq||''}"`,`"${sl(o.stage)}"`,`"${o.close_reason||''}"`,o.hw_amount||0,o.sw_amount||0,o.labor_amount||0,ta(o),o.probability,`"${o.close_date?fd(o.close_date):''}"`,`"${o.verkada_deal_reg?'Verkada Deal Reg':o.verkada_sourced?'Verkada Sourced':''}"`,`"${o.own}"`,`"Yes"`]);
  const csv=[hdrs.join(','),...rows.map(r=>r.join(','))].join('\n');
  const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`sprinter_q360_${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);
  await markSynced(all.map(o=>o.id));
  renderQ360(true);if(['pipeline','opportunities','companies'].includes(S.view))render();
}
